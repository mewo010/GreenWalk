name: GreenWalk Release & CI/CD

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release?'
        required: true
        type: boolean
        default: true
      version_tag:
        description: 'Release version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build, Test & Create Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Automated Tests
        run: npm run test

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Production Web Build
        run: npm run build

      - name: Package Distributable ZIP
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [ -n "${{ inputs.version_tag }}" ]; then
            VERSION="${{ inputs.version_tag }}"
          else
            VERSION="v1.0.${{ github.run_number }}"
          fi
          mkdir -p release-pkg
          cp -r dist release-pkg/greenwalk-$VERSION
          cd release-pkg
          zip -r ../greenwalk-$VERSION.zip greenwalk-$VERSION
          cd ..
          echo "PACKAGED_ZIP=greenwalk-$VERSION.zip" >> $GITHUB_ENV
          echo "RELEASE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Generate Release Notes
        id: release_notes
        run: |
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          cat <<EOF > RELEASE_NOTES.md
          # GreenWalk $RELEASE_VERSION 🚶‍♂️🚦

          **תאריך יצירה:** $DATE
          **גרסה:** $RELEASE_VERSION

          ### 🌟 מה חדש בגרסה זו?
          - ⏱️ שעון דיגיטלי בזמן אמת עם תצוגת שניות מדויקת.
          - 🚦 תזמון רמזורים עוקבים וחיזוי גל ירוק רציף לשני הרמזורים.
          - 🚶 מחשבון זמן יציאה מדויק: מתי לצאת כדי להגיע בירוק לשני הרמזורים ללא המתנה!
          - 📊 מערכת מדידה חכמה ברחוב בלחיצה אחת עם חישוב מחזוריות ורמת ביטחון סטטיסטית.
          - ⚙️ אפשרות להזנת זמנים ידנית והגדרת מהירויות הליכה ומרווחי ביטחון.
          - 🌓 ממשק Dark AMOLED יוקרתי ומלא בעברית (RTL), מותאם למכשירי סמסונג אנדרואיד ומסכי מובייל.
          - 🛡️ הודעות בטיחות מובנות.

          ### 📦 תוכן הקובץ המצורף:
          קובץ ה-ZIP \`$PACKAGED_ZIP\` מכיל את תוצר ה-Production המלא של האפליקציה, מוכן לפריסה ישירה בכל שרת אירוח סטטי (Vercel, Netlify, GitHub Pages, Nginx וכו').

          ### 🚀 הוראות התקנה והפעלה מקומית:
          1. הורידו וחלצו את קובץ ה-ZIP: \`$PACKAGED_ZIP\`.
          2. ניתן לפתוח את הקבצים ישירות או להריץ שרת מקומי:
             \`\`\`bash
             npx serve dist
             \`\`\`
          3. לפיתוח מקומי מקוד המקור:
             \`\`\`bash
             npm install
             npm run dev
             \`\`\`
          EOF

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          name: "GreenWalk ${{ env.RELEASE_VERSION }}"
          tag_name: ${{ env.RELEASE_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_NOTES.md
          files: ${{ env.PACKAGED_ZIP }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

